<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8"/>
	<!-- 适配，保证页面正常显示 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>登陆页面</title>

	 <!-- 引入Bootstrap样式，用于页面布局和按钮、表单美化 -->
    <link href="../css/bootstrap.css" rel="stylesheet"/>
	<!-- 引入字体图标-->
    <link href="../css/font-awesome.css" rel="stylesheet"/>

    <style>
		/* Vue渲染前隐藏，防止页面闪烁 */
        [v-cloak] {
            display: none;
        }
        .table th, .table td {
            text-align: center !important;
            vertical-align: middle !important;
        }
    </style>
</head>
<body style="background:url('../img/bg.jpg') no-repeat; background-size: cover;">
<div id="app" class="container" v-cloak>
    <div class="row text-center " style="padding-top:180px;">
        <div class="col-md-12">
           <h2 style="color: white">欢迎登录学生选课管理系统</h2>
        </div>
    </div>
	
	<!-- 登录表单区域，自适应居中 -->
    <div class="row ">

        <div class="col-md-4 col-md-offset-4 col-sm-6 col-sm-offset-3 col-xs-10 col-xs-offset-1">

            <div class="panel-body">
                <form role="form">
                    <hr/>
                    <br/>
					
					<!-- 用户名输入框 -->
                    <div class="form-group input-group">
                        <span class="input-group-addon"><i class="fa fa-tag"></i></span>
                        <input type="text" class="form-control" v-model="user.name" placeholder="用户名"/>
                    </div>
					
					 <!-- 密码输入框 -->
                    <div class="form-group input-group">
                        <span class="input-group-addon"><i class="fa fa-lock"></i></span>
                        <input type="password" class="form-control" v-model="user.password" placeholder=" 密码"/>
                    </div>
                    <h5 style="color: white">请选择角色</h5>
					<!-- 角色选择下拉框：管理员/教师/学生 -->
                    <div class="form-group input-group">
                        <span class="input-group-addon"><i class="fa fa-user"></i></span>
                        <select class="form-control" v-model="user.level">
                            <option value="" selected="">请选择</option>
                            <option value="1">管理员</option>
                            <option value="2">教师</option>
                            <option value="3">学生</option>
                        </select>
                    </div>
					
					<!-- 图形验证码输入框 + 验证码图片 -->
                    <div class="form-group input-group">
                        <span class="input-group-addon"><i class="fa fa-check-square"></i></span>
                        <input type="text" class="form-control" style="width: 150px; margin-right: 5px" v-model="user.verCode" placeholder="请输入图形验证码"/>
                        <img :src="captchaUrl" @click="clickImg()" width="135px" height="33px" />
                    </div>



                    <div style="text-align: center">
                        <a href="javascript:void(0)" class="btn btn-block btn-primary" @click="login">登录</a>
                    </div>
                    <hr/>
                    <div style="text-align: center">
                        <span style="color: white">未注册 ?</span> <a href="register.html" style="color: yellow">点击这里 </a>
                    </div>

                </form>
            </div>

        </div>
    </div>
</div>

<script src="../js/vue2.6.11/vue.min.js"></script>
<script src="../js/vue2.6.11/axios.js"></script>

<script>
	// 创建Vue实例
    new Vue({
        el: "#app",
        data: {
            user: {},
            captchaUrl: "/captcha"
        },
        created: function () {

        },
        methods: {
            login() {
                axios.post("/login", this.user).then(res => {
                    if (res.data.code === '0') {
                        let user = res.data.data;
                        localStorage.setItem('user', JSON.stringify(user));
                        if (user && user.level && 1 === user.level) {
                            window.location = "/end/page/accountAdminInfo.html";
                        }
                        if (user && user.level && 2 === user.level) {
                            window.location = "/end/page/accountTeacherInfo.html";
                        }
                        if (user && user.level && 3 === user.level) {
                            window.location = "/end/page/accountStudentInfo.html";
                        }
                    } else {
                        alert(res.data.msg);
                        this.clickImg();
                    }
                })
            },
			
			// 点击验证码图片：刷新验证码（加随机数防止浏览器缓存）
            clickImg() {
                this.captchaUrl='/captcha?' + Math.random();
                this.user.verCode = "";
            },
        }
    });
</script>
</body>
</html>
